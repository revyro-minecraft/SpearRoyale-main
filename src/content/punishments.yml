# ============================================================
# Punishments Page Content
# ============================================================
# Shows recent punishments and the appeal process.
# Replace `recent` entries with real data from an API when
# available. The component reads this array directly.
# ============================================================

header:
  eyebrow: "Transparency"
  title: "Punishments"
  description: "We believe in transparency. Below is a log of recent punishments issued on Spear Royale. If you believe a punishment was issued in error, you can appeal."

# Appeal info card
appeal:
  title: "Want to appeal a punishment?"
  description: "Open a ticket in our Discord server and select the Punishment Appeal option. Include your username, the punishment ID, and why you believe it was issued in error."
  buttonText: "Open Appeal Ticket"
  buttonHref: "https://discord.gg/spearroyale"

# Punishment types legend
types:
  - type: "Ban"
    icon: "Ban"
    color: "text-red-500"
    description: "Account permanently removed from the server."
  - type: "Temp Ban"
    icon: "Clock"
    color: "text-orange-500"
    description: "Temporary removal from the server with a set duration."
  - type: "Mute"
    icon: "MessageCircleOff"
    color: "text-amber-400"
    description: "Player cannot send chat messages."
  - type: "Kick"
    icon: "LogOut"
    color: "text-slate-400"
    description: "Player removed from the server but can rejoin."

# Recent punishments log
# `type` must match one of the types above.
# `reason` is the staff-written reason.
# `staff` is the staff member who issued it.
# `date` is a display string.
